server:
  port: 8080

spring:
  application:
    name: talentbridge-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/talentbridge}
  session:
    store-type: mongodb
    mongodb:
      collection-name: sessions
    timeout: 2h
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

talentbridge:
  mail:
    from: ${MAIL_FROM:no-reply@talentbridge.example}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  tokens:
    email-verification-hours: 24
    password-reset-hours: 1
  listing:
    stale-after-days: 14
  referral:
    partner-terms-review-max-age-days: 365
  finance:
    second-approver-required: ${FINANCE_SECOND_APPROVER_REQUIRED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed:
    enabled: ${SEED_ENABLED:false}

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.talentbridge: INFO
